name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: astraguard
          POSTGRES_PASSWORD: astraguard
          POSTGRES_DB: astraguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astraguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://astraguard:astraguard@localhost:5432/astraguard
      REDIS_URL: redis://localhost:6379
      HORIZON_URL: https://horizon-testnet.stellar.org
      SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      API_KEY_SALT: ci-test-salt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run migrate
      - run: npm test
      - run: npm run test:integration
      - run: npm run build

  # Two-stage OpenAPI gate:
  #
  # 1. validate-openapi  — runs @redocly/cli lint against src/api/openapi.yaml.
  #    Catches malformed YAML, invalid $refs, duplicate operationIds, undefined path
  #    parameters, and other schema violations that the old grep-for-"openapi:" check
  #    would silently pass.
  #
  # 2. check-routes-drift — compares every Fastify route registered under
  #    src/api/routes/*.ts and src/api/app.ts against the paths declared in openapi.yaml.
  #    Exits non-zero if any route is missing from the spec, so drift is caught here
  #    rather than only when the frontend regenerates its api-client.
  validate-openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint OpenAPI spec with Redocly
        run: npm run check:openapi
      - name: Check route-vs-spec drift
        run: npm run check:routes
